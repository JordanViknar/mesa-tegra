name: Arch Linux ARMv7h CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archlinux-armv7h:
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash

    steps:
      # No need to checkout the repository here.

      - name: Fetch PKGBUILD inputs
        run: |
          set -euxo pipefail
          install -d "$GITHUB_WORKSPACE/packaging/archlinuxarm"

          # Pull the mesa-git AUR snapshot, which contains related files
          wget -O /tmp/mesa-git.tar.gz 'https://aur.archlinux.org/cgit/aur.git/snapshot/mesa-git.tar.gz'
          tar -xzf /tmp/mesa-git.tar.gz -C "$GITHUB_WORKSPACE/packaging/archlinuxarm" --strip-components=1

          # Pull the PKGBUILD from whichever branch actually triggered this run
          wget -O "$GITHUB_WORKSPACE/packaging/archlinuxarm/PKGBUILD" \
            "https://raw.githubusercontent.com/JordanViknar/mesa-tegra/refs/heads/${GITHUB_REF_NAME}/packaging/archlinuxarm/PKGBUILD"

          # Pin the PKGBUILD's own mesa source to the exact commit and branch
          sed -i "s|#branch=tegra-fixes|#commit=${GITHUB_SHA}|" "$GITHUB_WORKSPACE/packaging/archlinuxarm/PKGBUILD"

      - name: Restore ccache / pacman package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mesa-tegra-ci/ccache
            ~/.cache/mesa-tegra-ci/pacman-pkg
          key: mesa-tegra-archlinuxarm-armv7h-${{ github.sha }}
          restore-keys: |
            mesa-tegra-archlinuxarm-armv7h-

      - name: Build inside ARMv7 container
        env:
          MESA_WHICH_LLVM: '4'
        run: |
          set -euxo pipefail
          mkdir -p ~/.cache/mesa-tegra-ci/ccache ~/.cache/mesa-tegra-ci/pacman-pkg

          docker run --rm --platform linux/arm/v7 \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/mesa-tegra-ci/ccache:/home/build/.cache/ccache" \
            -v "$HOME/.cache/mesa-tegra-ci/pacman-pkg:/var/cache/pacman/pkg" \
            -w /work/packaging/archlinuxarm \
            menci/archlinuxarm:base-devel \
            \
            bash -lc '
              set -euxo pipefail
              
              # Disable sandboxing
              grep -qxF "DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf

              # Enable ccache
              sed -i "s/!ccache/ccache/" /etc/makepkg.conf

              # Install dependencies
              pacman -Sy --noconfirm --needed archlinuxarm-keyring wget tar sudo ccache

              # Create a build user with sudo privileges
              useradd -m build -G wheel
              install -d -m 0755 /etc/sudoers.d
              printf "%%wheel ALL=(ALL:ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/build
              chmod 0440 /etc/sudoers.d/build

              chown -R build:build /work /home/build/.cache/ccache

              su build -c "cd /work/packaging/archlinuxarm && makepkg --syncdeps --noconfirm --cleanbuild --clean --log --ignorearch"
              
              chown -R 1001:1001 /work /home/build/.cache/ccache
            '

      - name: Collect artifacts
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$GITHUB_WORKSPACE/packaging/archlinuxarm" -maxdepth 1 -type f \( -name '*.pkg.tar.*' \) -exec cp -t "$GITHUB_WORKSPACE/artifacts" {} +

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archlinux-armv7h-pkg
          path: artifacts/
          retention-days: 7